name: Linux Tailscale VPN Server

on:
  workflow_dispatch:

jobs:
  vpn-server:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Enable IP Forwarding
        run: |
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo sysctl -w net.ipv6.conf.all.forwarding=1

      - name: 2. Connect Tailscale via Official Action
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --advertise-exit-node --accept-dns=true --hostname=github-vpn-node --reset

      - name: 3. Keep Alive
        run: |
          echo "VPN Server is running natively!"
          sleep 21600
