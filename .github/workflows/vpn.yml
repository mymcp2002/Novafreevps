name: Linux Tailscale VPN Server

on:
  workflow_dispatch:

jobs:
  vpn-server:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Enable IP Forwarding and NAT
        run: |
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo sysctl -w net.ipv6.conf.all.forwarding=1
          sudo iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
          sudo ip6tables -t nat -A POSTROUTING -o eth0 -j MASQUERADE

      - name: 2. Connect Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --advertise-exit-node --hostname=github-vpn-node --reset

      - name: 3. Keep Alive
        run: |
          echo "VPN Server is running successfully with NAT enabled!"
          sleep 21600
